name: 🌐 自动发布 SEO/GEO 深度矩阵文章 (每4天)

on:
  schedule:
    # 每 4 天自动执行一次，设置在 UTC 02:00（即北京时间上午 10:00）
    - cron: '0 2 */4 * *'
  workflow_dispatch: # 支持在 GitHub 仓库 Actions 界面手动一键触发

permissions:
  contents: write

jobs:
  publish-matrix-article:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js 运行环境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 防批量时间指纹扰动 (Anti-Fingerprint Temporal Jitter)
        if: github.event_name == 'schedule'
        run: |
          # 随机延迟 0~20 分钟（0~1200秒），杜绝固定秒级整点打点提交的批量爬虫指纹特征
          JITTER_SECONDS=$((RANDOM % 1200))
          echo "🛡️ [防批量AI识别系统] 注入时间扰动延迟: ${JITTER_SECONDS} 秒..."
          sleep ${JITTER_SECONDS}

      - name: 安装项目依赖 (Install Dependencies)
        run: npm ci

      - name: 调用 DeepSeek API 生成万字级 SEO/GEO 矩阵长文
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node scripts/generate-matrix-article.mjs

      - name: 静态构建与搜索引擎质检验证 (Astro Build Verification)
        run: |
          npm run build

      - name: 提交并推送到 GitHub 触发自动部署 (严格移除 [skip ci])
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "ℹ️ 未检测到新内容或文件变更，跳过提交。"
          else
            # 严格剔除任何 [skip ci] 标记，确保 Cloudflare Pages / CI/CD 自动捕获最新推送并即时部署上线
            COMMIT_MSG=$(cat .last_matrix_commit.txt 2>/dev/null || echo "feat(matrix): 自动发布深度SEO/GEO矩阵长文文献")
            echo "🚀 准备提交并触发全网部署: $COMMIT_MSG"
            git commit -m "$COMMIT_MSG"
            git push origin main
          fi
